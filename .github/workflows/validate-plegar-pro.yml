            if (Number(moduleSync.thickness) !== 3 || !String(moduleSync.collisionThickness).includes('3.00') ||
                !moduleSync.fields.every(x => Number(x[1]) === 3)) {
              throw new Error('Shared thickness was not propagated to all modules: ' + JSON.stringify(moduleSync));
            }
            const selectedStepSync = await page.evaluate(async () => {
              const collision = document.querySelector('#pp56Step');
              const twin = document.querySelector('#pp59step');
              if (!collision || !twin || collision.options.length < 3 || twin.options.length < 3) return { error: 'Step selectors unavailable' };
              collision.value = '0';
              collision.dispatchEvent(new Event('change', { bubbles: true }));
              await new Promise(r => setTimeout(r, 80));
              const fromCollision = { collision: Number(collision.value), twin: Number(twin.value), activeFold: sim.p3Active, expectedFold: state.bendOrder[0] };
              twin.value = '2';
              twin.dispatchEvent(new Event('change', { bubbles: true }));
              await new Promise(r => setTimeout(r, 80));
