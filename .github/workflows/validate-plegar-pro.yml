            });
            if (corePlayback.error || !corePlayback.advanceOk || !corePlayback.pauseOk || !corePlayback.resumeOk || !corePlayback.crossModuleOk) throw new Error('Core 2D/3D playback or cross-module step sync failed: ' + JSON.stringify(corePlayback));
            const finalCoreFold = await page.evaluate(async () => {
              const maxStep = Math.max(0, state.bends.length - 1), play = document.querySelector('#s2Play'), pause = document.querySelector('#s2Pause');
              state.settings.simulationSpeed = 100; sim.s2Step = Math.max(0, maxStep - 1); sim.s3Step = sim.s2Step; drawAll(); play.click();
              const deadline = Date.now() + 1600;
              while (play.dataset.playing === 'true' && Date.now() < deadline) await new Promise(r => setTimeout(r, 25));
              const result = {maxStep, finalStep: sim.s2Step, stopped: play.dataset.playing !== 'true', synchronized: sim.s2Step === sim.s3Step};
              if (play.dataset.playing === 'true') pause.click();
              return result;
            });
            if (!finalCoreFold.stopped || finalCoreFold.finalStep !== finalCoreFold.maxStep || !finalCoreFold.synchronized) throw new Error('Core simulation did not execute the final programmed fold: ' + JSON.stringify(finalCoreFold));
            await page.locator('[data-page="collisions"]').click();
            await page.waitForFunction(() => document.querySelector('#collisions')?.classList.contains('active'), null, { timeout: 10000 });

            const finalCollisionFold = await page.evaluate(async () => {
