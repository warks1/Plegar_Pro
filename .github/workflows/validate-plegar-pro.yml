name: Validate Plegar Pro
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feature/plegar-pro-engineering-upgrade]
jobs:
  syntax-and-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in pp54-engineering.js pp55-cad-precision.js pp56-collision-review.js pp57-system-integration.js pp59-engineering-upgrade.js pp60-graphics-runtime.js pp61-runtime-integrity.js pp62-contrast-playback-fix.js pp63-v85-parametric-model.js sw.js; do
            echo "Checking $file"
            node --check "$file"
          done
      - name: Test V85 and Bystronic 3D reference meshes and prism collisions
        run: |
          node <<'NODE'
          global.window = {};
          require('./pp63-v85-parametric-model.js');
          const m = window.PP63V85Model;
          if (!m || m.SPEC.bendingLengthMm !== 2050 || m.SPEC.betweenUprightsMm !== 1750) throw new Error('V85 reference dimensions missing');
          if (m.BYSTRONIC.bendingLengthMm !== 3100 || m.BYSTRONIC.forceKN !== 1000 || m.BYSTRONIC.forceTonnes !== 100) throw new Error('Bystronic 100/3100 reference dimensions missing');
          for (const id of [m.SPEC.id,m.BYSTRONIC.id]) {
            const mesh = m.machineMesh(id);
            if (mesh.length < 5 || mesh.some(x => !x.vertices.length || !x.triangles.length)) throw new Error('Invalid machine mesh: '+id);
          }
          const sheet = m.segmentPrism({x:-2,y:0},{x:2,y:0},1,-100,100,'sheet');
          const hit = m.prismMesh([{x:-1,y:-1},{x:1,y:-1},{x:1,y:1},{x:-1,y:1}],-50,50,'tool');
          const miss = m.prismMesh([{x:10,y:10},{x:12,y:10},{x:12,y:12},{x:10,y:12}],-50,50,'remote-tool');
          if (!m.intersectPrisms(sheet,hit).intersects) throw new Error('Expected prism collision was not detected');
          if (m.intersectPrisms(sheet,miss).intersects) throw new Error('False-positive prism collision');
          const noZ = m.prismMesh([{x:-1,y:-1},{x:1,y:-1},{x:1,y:1},{x:-1,y:1}],200,250,'separated-z');
          if (m.intersectPrisms(sheet,noZ).intersects) throw new Error('Z-separated solids must not collide');
          const concave = m.prismMesh([{x:0,y:0},{x:3,y:0},{x:3,y:1},{x:1,y:1},{x:1,y:3},{x:0,y:3}],0,10,'concave-L');
          if (!concave || !concave.triangles.length) throw new Error('Concave tooling profile failed triangulation');
          const capArea = concave.triangles.filter(t => t.every(i => i < 6)).reduce((sum,t) => {
            const [a,b,c] = t.map(i => concave.vertices[i]);
            return sum + Math.abs((b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]))/2;
          },0);
          if (Math.abs(capArea-5)>1e-8) throw new Error('Concave profile cap triangulation area mismatch: '+capArea);
          console.log('V85, Bystronic, and 3D prism checks passed');
          NODE
      - name: Verify module and cache wiring
        run: |
          grep -Fq './pp59-engineering-upgrade.js' index.html
          grep -Fq './pp60-graphics-runtime.js' index.html
          grep -Fq './pp61-runtime-integrity.js' index.html
          grep -Fq './pp62-contrast-playback-fix.js' index.html
          grep -Fq './pp63-v85-parametric-model.js?v=63.2' index.html
          grep -Fq './pp63-v85-parametric-model.js?v=63.2' sw.js
          grep -Fq './pp60-graphics-runtime.js' sw.js
          grep -Fq './pp61-runtime-integrity.js' sw.js
          grep -Fq './pp62-contrast-playback-fix.js' sw.js
          grep -Fq './pp59-engineering-upgrade.js' sw.js
          grep -Eq "const CACHE='plegar-pro-v[0-9]+-[0-9]+'" sw.js
          grep -Fq 'id="pp70-startup-rescue"' index.html
          grep -Fq '#loader .side,#loader .sidebar,#loader .nav,#loader .mobileMenuBtn{display:none!important}' index.html
          grep -Fq "e.request.mode==='navigate'?caches.match('./index.html'):Response.error()" sw.js
          grep -Fq "if(r.ok&&r.type!=='opaque')" sw.js
          grep -Fq './pp55-cad-precision.js' index.html
          grep -Fq 'window.tools=tools;' index.html
          grep -Fq 'id="machine"><option value="Bystronic Xpert Pro 3100 × 100 T"' index.html
          grep -Fq 'value="TRUMPF TrumaBend V85"' index.html
          if grep -Fq 'Bystronic Xpert 3200 × 150 T' index.html || grep -Fq '<option>Personalizada</option>' index.html; then echo 'Unsupported machine options must not reuse a reference-machine geometry'; exit 1; fi
          grep -Fq 'id="pp64-visual-redesign"' index.html
          grep -Fq 'id="pp67-banner-contrast-runtime"' index.html
          grep -Fq 'id="pp70-light-readable-panels"' index.html
          grep -Fq 'id="pp68-loader-emergency-release"' index.html
          grep -Fq "attributeFilter:['class']" index.html
          grep -Fq "v64.8 · INDUSTRIAL EDITION" pp56-collision-review.js
          grep -Fq '.nav button.active:before' index.html
          grep -Fq '#dashboard .card:first-child' index.html
      - name: Check v59 integration anchors and persisted controls
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const read = p => fs.readFileSync(p, 'utf8');
          const html = read('index.html');
          const engineering = read('pp54-engineering.js');
          const cad = read('pp55-cad-precision.js');
          const system = read('pp57-system-integration.js');
          const collision = read('pp56-collision-review.js');
          const v59 = read('pp59-engineering-upgrade.js');
          const sw = read('sw.js');
          const failures = [];
          const toolDraw = cad.slice(cad.indexOf('function drawTool()'), cad.indexOf('\nfunction ', cad.indexOf('function drawTool()') + 10) > -1 ? cad.indexOf('\nfunction ', cad.indexOf('function drawTool()') + 10) : undefined);
          if (!toolDraw || !toolDraw.includes('function poly(points,col)') || /\biso\(/.test(toolDraw)) failures.push('CAD tooling renderer must use the defined poly() helper consistently');
          if (!collision.includes('tipY=top+4+travel*55')) failures.push('collision section punch travel formula missing');
          if (!collision.includes('const clearancePx=apexY-tipBottomY-sheetHalfPx') || !collision.includes("clearancePx<0?'SOLAPAMIENTO PROYECTADO'") || !collision.includes('projectedClearancePx:clearancePx') || !collision.includes('function collisionGeometry(stepIndex,foldIndex,travel,b,toolAudit,v)') || !collision.includes('segmentsCross') || !collision.includes('function distSegments(a,b,c,d)') || !collision.includes('segmentHitsPoly(a,b,poly,thickness=0)') || !collision.includes('dieHalf3D=Math.max(16,Math.min(170,v*3.4375))') || !collision.includes('tipHalf3D=Math.max(8,Math.min(70,Math.tan(punchAngle*Math.PI/360)*70))') || !collision.includes("collisionModelUnit:'mm'")) failures.push('collision review must include signed visual clearance plus millimetre polygon intersection analysis');
          if (!html.includes('XNC-EV026-V24') || !html.includes('profilePointsMm') || !collision.includes('imported DXF profile points in physical mm')) failures.push('measured EV026 die cross-section must feed physical collision polygon with provenance');
          if (!collision.includes('activeBendContact:{checked:true') || !collision.includes('activeBendIntersectionChecked:true')) failures.push('active bend contact audit missing');
          if (!collision.includes('function parseDxfProfile') || !html.includes('profileDownloadUrl') || !collision.includes('auditSequences:runSequenceRegressionTests')) failures.push('DXF import, source links, or U/Z/box sequence audit missing');
          if (!collision.includes('function selectedToolAudit(b,v)') || !collision.includes('collisionSolidUsesCatalogProfile:!!(punch?.profilePointsMm||die?.profilePointsMm)') || !collision.includes('VISTA ESQUEMÁTICA · GEOMETRÍA PARAMÉTRICA') || !collision.includes('dieAmbiguous:!die&&dieMatches.length>1') || !collision.includes('punchAmbiguous:!punch&&punchMatches.length>1') || !collision.includes('id="pp56DieSelect"') || !collision.includes('id="pp56PunchSelect"') || !collision.includes('function refreshDieOptions()') || !collision.includes('function refreshPunchOptions()') || !collision.includes('.pp-module-form,.pp-module-form *{color:#f4f8fb!important}') || !collision.includes('catálogo AMADA AFH (fabricante)') || !collision.includes('biblioteca dimensional Xeon NC') || !collision.includes('matrices multi-V PBTC')) failures.push('collision view must disclose schematic geometry, require explicit tool selection, readable banners, and traceable catalog references');
          if (!collision.includes('const included=180-(180-ang)*travel') || !collision.includes('apexY=top+42+travel*25') || !collision.includes('ÁNGULO ACTUAL')) failures.push('programmed section bend must show progressive included-angle deformation');
          const assetBlock = sw.match(/const ASSETS=\[(.*?)\]/s);
          if (!assetBlock) failures.push('service worker asset list missing');
          else {
            const assets = [...assetBlock[1].matchAll(/'([^']+)'/g)].map(m => m[1]);
            for (const asset of assets) if (!fs.existsSync(asset.split('?')[0])) failures.push('service worker asset missing: ' + asset);
          }
          const inlineScripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(([, attrs]) => !/\bsrc\s*=/.test(attrs) && !/\btype=["'](?:application\/json|application\/ld\+json)/i.test(attrs));
          inlineScripts.forEach(([, , source], i) => {
            try { new Function(source); }
            catch (error) { failures.push('inline script ' + i + ' syntax error: ' + error.message); }
          });
          const ids = [...html.matchAll(/\bid=["']([^"']+)["']/g)].map(m => m[1]);
          const counts = ids.reduce((out, id) => (out[id] = (out[id] || 0) + 1, out), {});
          const duplicateIds = Object.entries(counts).filter(([, count]) => count > 1).map(([id]) => id);
          if (duplicateIds.length) failures.push('duplicate static HTML ids: ' + duplicateIds.join(', '));
          if ((html.match(/\.\/pp59-engineering-upgrade\.js/g) || []).length !== 1) failures.push('v59 script must be wired exactly once in index.html');
          if ((html.match(/\.\/pp60-graphics-runtime\.js/g) || []).length !== 1) failures.push('v60 graphics runtime must be wired exactly once in index.html');
          if (html.includes('<div class="logoText">PLEGAR <i>PRO</i></div>')) failures.push('loader must use the industrial emblem without visible wordmark');
          if (!html.includes('PP_SPLASH_DURATION=5000')) failures.push('loader duration must remain 5 seconds');
          for (const id of ['program3d', 'tooling']) {
            if (!html.includes('id="' + id + '"')) failures.push('index.html missing #' + id);
          }
          if (!cad.includes('function poly(points,col)')) failures.push('CAD tooling view missing axonometric face renderer');
          if (!html.includes('window.tools=tools;')) failures.push('shared tool catalog must be exposed to the CAD and collision modules');
           if (!html.includes('XNC-EV002') || !html.includes('PBTC-2009-V50') || !html.includes('sourceType') || !html.includes('Ver ficha fuente')) failures.push('secondary-catalog tooling must retain dimensions, source provenance, and links');
          if (!html.includes('id="pp64-visual-redesign"') || !html.includes('.nav button.active:before') || !html.includes('#dashboard .card:first-child')) failures.push('visible industrial UI redesign styles missing');
          for (const id of ['pp55ToolSelect', 'pp55ToolCAD']) {
            if (!cad.includes(id)) failures.push('CAD module missing integration anchor ' + id);
          }
          for (const id of ['pp58DbCard', 'pp58Office', 'pp58TwinCard']) {
            if (!system.includes(id)) failures.push('system module missing integration anchor ' + id);
          }
          for (const token of ['function savePrefs()', 'prefs.camera=v', 'prefs.zoom=zoom', 'prefs.step=', 'prefs.yaw=yaw', 'prefs.pitch=pitch', 'syncStepOptions()', 'pp59collisions', 'frameHandle=0', 'function scheduleTick()', 'pausedCycle=0', 'function executionOrder()', 'order=executionOrder()', 'heading-=(Number(q.direction)||1)', 'PASO ']) {
            if (!v59.includes(token)) failures.push('v59 missing expected persistence hook: ' + token);
          }
          if (!v59.includes('function executionOrder()') || !v59.includes('heading-=(Number(q.direction)||1)')) failures.push('v59 playback must consume the assigned execution order and fold toward the die');
          if (!html.includes('function ppExecutionRank(i)') || !html.includes('ppExecutionRank(i)<step')) failures.push('core 2D/3D playback must read the assigned order directly');
          if (engineering.includes('drawSelectedMarkers()') || !engineering.includes('drawFoldNumbers()')) failures.push('v54 drawing hook must call the existing fold marker renderer, not an undefined function');
          if (!collision.includes('function profileModel(progressStep=Infinity,progressTravel=1)') || !collision.includes('const model=profileModelPhysical(step,travel,toolAudit,v)') || !collision.includes('function profileModelPhysical(progressStep=Infinity,progressTravel=1,toolAudit={},v=16)') || !collision.includes('bendIndex:i') || !collision.includes('rank===progressStep?Math.max(0,Math.min(1,progressTravel)):0')) failures.push('collision sheet must use the shared programmed profile and assigned fold order');
          if (!html.includes('@media(max-width:560px)') || !html.includes('.app{grid-template-columns:minmax(0,1fr)}')) failures.push('responsive mobile layout rules missing');
          const runtime = read('pp61-runtime-integrity.js');
          if (!html.includes("if((Number(sim[key+'Step'])||0)>=maxStep)sim[key+'Step']=0")) failures.push('2D/3D playback must restart at the beginning after reaching the final fold');
          if (!html.includes("plegarpro:playback-step") || !html.includes("plegarpro:playback-start")) failures.push('core playback must publish shared playback events');
          if (!collision.includes("if(step>=Math.max(0,seq().length-1))setStep(0)") || !collision.includes("if(!playing||!raf)")) failures.push('collision playback must start on first entry and restart after completion');
          if (!runtime.includes('function installPlaybackSync()') || !runtime.includes("addEventListener('plegarpro:playback-step'")) failures.push('shared playback synchronizer missing');
          if (runtime.indexOf('const order=Array.isArray(s?.bendOrder)') > runtime.indexOf('if(detail.complete)pos=Math.max(0,order.length-1)')) failures.push('playback completion reads order before initialization');
          if (!runtime.includes("$('pp59play')?.textContent?.includes('Pausar')")) failures.push('visibility handler must stop the engineering twin playback');
          if (!v59.includes('(playing?Number(b.angle):Number($(\'pp59angle\')?.value)')) failures.push('3D playback must use each bend own angle');
          if (!html.includes('const maxStep=Math.max(0,(Array.isArray(state.bends)?state.bends.length:0)-1)')) failures.push('core playback must stop at the actual number of folds');
          if (!html.includes("Math.min(Math.max(0,state.bends.length-1),(Number(sim[key+'Step'])||0)+1)")) failures.push('manual playback next-step must stay inside the fold sequence');
          if (!collision.includes('sim.s2Step=step;sim.s3Step=step;')) failures.push('collision step must map to the same shared sequence index');
          if (runtime.includes("if(source==='s2'||source==='s3')pos=Math.max(0,pos-1)")) failures.push('playback synchronizer still contains the off-by-one step mapping');
          if (!runtime.includes('if(detail.complete)pos=Math.max(0,order.length-1)')) failures.push('playback synchronizer must handle the final completed fold');
          if (!system.includes("el.id='pp58SyncStatus-'+id") || !system.includes("el.dataset.pp58SyncStatus='true'")) failures.push('module sync indicators must use unique IDs and shared data marker');
          if (system.includes("el.id='pp58SyncStatus';")) failures.push('duplicate synchronization status IDs remain');
          if (!/const CACHE='plegar-pro-v[0-9]+-[0-9]+'/.test(sw)) failures.push('service worker cache key missing or invalid');
          if (html.indexOf('./pp57-system-integration.js') > html.indexOf('./pp59-engineering-upgrade.js')) {
            failures.push('v59 must load after the existing system integration module');
          }
          if (!fs.readFileSync('pp56-collision-review.js','utf8').includes('function parseDxfProfile') || !fs.readFileSync('pp56-collision-review.js','utf8').includes('pp56ProfileImport')) failures.push('DXF dimensional profile import is missing');
          if (!fs.readFileSync('index.html','utf8').includes('UKB-25304') || !fs.readFileSync('index.html','utf8').includes('profileDownloadUrl')) failures.push('UKB DXF reference catalogue is missing');
          if (failures.length) {
            console.error(failures.join('\\n'));
            process.exit(1);
          }
          console.log('Integration anchors and preference persistence verified.');
          NODE
  collision-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard collision semantics and CAD disclosure
        run: node tests/collision-contract.test.cjs
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start static server and test startup, 3D canvas, and collision navigation
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/plegar-pro-server.log 2>&1 &
          SERVER_PID=$!
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep 1; done
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({ viewport: { width: 1440, height: 1000 }, serviceWorkers: 'block' });
            const page = await context.newPage();
            const errors = [];
            await page.addInitScript(() => { window.addEventListener('error', e => console.error('[Plegar Pro JS ERROR LOCATION]', JSON.stringify({message:e.message,filename:e.filename,lineno:e.lineno,colno:e.colno,stack:e.error?.stack}))); });
            page.on('console', msg => { if (msg.type() === 'error') console.error('[Plegar Pro console error]', JSON.stringify(msg.location()), msg.text()); });
            page.on('pageerror', error => { errors.push(error.stack || error.message); console.error('[Plegar Pro browser pageerror]', error.stack || error.message); });
            const started = Date.now();
            await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await page.waitForFunction(() => document.body.classList.contains('boot-complete'), null, { timeout: 15000 });
            const splashMs = Date.now() - started;
            if (splashMs < 4800) throw new Error('Loading screen closed too early: ' + splashMs + 'ms');
            await page.waitForSelector('#pp59canvas', { state: 'attached', timeout: 10000 });
            await page.locator('[data-page="program3d"]').click();
            await page.waitForTimeout(350);
            const program3dDebug = await page.evaluate(() => ({
              activePages: [...document.querySelectorAll('.page.active')].map(e => e.id),
              canvas: (() => { const c = document.querySelector('#pp59canvas'); if (!c) return null; const r = c.getBoundingClientRect(); const ancestors=[]; let n=c; while(n&&ancestors.length<7){const q=n.getBoundingClientRect(),cs=getComputedStyle(n);ancestors.push({tag:n.tagName,id:n.id,cls:String(n.className).slice(0,70),width:q.width,height:q.height,display:cs.display,visibility:cs.visibility});n=n.parentElement} return { width: r.width, height: r.height, parent: c.parentElement?.id || c.parentElement?.className, visible: getComputedStyle(c).display, ancestors }; })(),
              pp59: !!window.PLEGAR_PRO_V59,
              pp58: window.PLEGAR_PRO_V58?.audit?.(),
              pp61: window.PLEGAR_PRO_V61?.audit?.()
            }));
            if (!program3dDebug.canvas || program3dDebug.canvas.width <= 0) throw new Error('Programación 3D canvas not visible after navigation: ' + JSON.stringify(program3dDebug));
            const machinePreviewAudit = await page.evaluate(() => {
              const canvas = document.querySelector('#pp59canvas');
              const heading = document.querySelector('#pp59Twin h2')?.textContent || '';
              const pixels = canvas?.getContext('2d')?.getImageData(0, 0, canvas.width, canvas.height).data;
              let brightPixels = 0;
              if (pixels) for (let i = 0; i < pixels.length; i += 4) if (pixels[i] > 180 && pixels[i + 1] > 180 && pixels[i + 2] > 180 && pixels[i + 3] > 200) brightPixels++;
              return { heading, brightPixels, canvasDataUrlLength: canvas?.toDataURL()?.length || 0 };
            });
            if (!machinePreviewAudit.heading.includes('GEMELO DIGITAL 3D') || machinePreviewAudit.brightPixels < 1000) {
              throw new Error('Live machine preview canvas appears empty or its title is missing: ' + JSON.stringify(machinePreviewAudit));
            }
            const twinSource = await page.evaluate(() => document.querySelector('#pp59canvas')?.toDataURL() || '');
            if (!twinSource || twinSource.length < 10000 || machinePreviewAudit.canvasDataUrlLength < 10000) throw new Error('Live machine preview did not render a meaningful canvas image');
            await page.locator('[data-page="tooling"]').click();
            await page.waitForFunction(() => {
              const canvas = document.querySelector('#pp55ToolCanvas');
              return canvas && canvas.getBoundingClientRect().width > 0 && !!canvas.getContext('2d');
            }, null, { timeout: 10000 });
            const catalogAudit = await page.evaluate(() => ({ count: Array.isArray(window.tools) ? window.tools.length : 0, punches: Array.isArray(window.tools) ? window.tools.filter(t => /punz[oó]n|punch/i.test(String(t.type || t.name || ''))).length : 0, dies: Array.isArray(window.tools) ? window.tools.filter(t => /matriz|die/i.test(String(t.type || t.name || ''))).length : 0 }));
            if (catalogAudit.count < 1 || catalogAudit.punches < 1 || catalogAudit.dies < 1) throw new Error('Shared tooling catalog not available to CAD/collision modules: ' + JSON.stringify(catalogAudit));
            await page.locator('#pp55ToolView').selectOption('iso');
            await page.locator('[data-page="program3d"]').click();
            await page.locator('#pp59cam').selectOption('front');
            const savedCamera = await page.evaluate(() => JSON.parse(localStorage.getItem('plegarPro.v59.prefs') || '{}').camera);
            if (savedCamera !== 'front') throw new Error('Camera preference was not saved');
            await page.evaluate(() => {
              state.bends = [
                { leg: 50, angle: 90, radius: 2, v: 16, direction: 1 },
                { leg: 80, angle: 45, radius: 2, v: 16, direction: -1 },
                { leg: 120, angle: 135, radius: 2, v: 16, direction: 1 },
                { leg: 80, angle: 90, radius: 2, v: 16, direction: 1 }
              ];
              state.bendOrder = [2, 0, 1];
              window.PLEGAR_PRO_V59.refresh();
            });
            const machineOrder = await page.locator('#pp59step option').allTextContents();
            if (!machineOrder[0]?.includes('P3') || !machineOrder[1]?.includes('P1') || !machineOrder[2]?.includes('P2')) {
              throw new Error('3D playback selector ignored the assigned fold order: ' + machineOrder.join(' | '));
            }
            await page.locator('#pp59collisions').click();
            await page.waitForFunction(() => document.querySelector('#collisions')?.classList.contains('active'), null, { timeout: 10000 });
            await page.waitForFunction(() => {
              const canvas = document.querySelector('#pp56Collision');
              return canvas && canvas.getBoundingClientRect().width > 0 && !!canvas.getContext('2d');
            }, null, { timeout: 10000 });
            const contrastAudit = await page.evaluate(() => {
              const targets = [...document.querySelectorAll('#collisions .pp56-hmi-top,#collisions .pp56-hmi-rail,#collisions .pp56-hmi-live,#collisions #pp56Status')];
              const lum = value => {
                const rgb = String(value).match(/[0-9.]+/g)?.slice(0,3).map(Number) || [0,0,0];
                const linear = rgb.map(v => { v /= 255; return v <= .04045 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; });
                return .2126 * linear[0] + .7152 * linear[1] + .0722 * linear[2];
              };
              return targets.map(el => {
                const s = getComputedStyle(el), fg = lum(s.color), bg = lum(s.backgroundColor);
                return { id:el.id || el.className, foreground:s.color, background:s.backgroundColor, ratio:(Math.max(fg,bg)+.05)/(Math.min(fg,bg)+.05) };
              });
            });
            if (contrastAudit.length < 4 || contrastAudit.some(x => x.ratio < 4.5)) throw new Error('Banner/card text contrast below 4.5:1: ' + JSON.stringify(contrastAudit));
            await page.waitForFunction(() => document.querySelectorAll('#pp56Step option').length >= 3, null, { timeout: 5000 });
            const collisionOrder = await page.locator('#pp56Step option').allTextContents();
            if (!collisionOrder[0]?.includes('P3') || !collisionOrder[1]?.includes('P1') || !collisionOrder[2]?.includes('P2')) {
              throw new Error('Collision review ignored the assigned fold order: ' + collisionOrder.join(' | '));
            }
            const dieSelector = page.locator('#pp56DieSelect');
            await dieSelector.selectOption('MEC-M-V16');
