              return { fromCollision, fromTwin };
            });
            if (selectedStepSync.error ||
                selectedStepSync.fromCollision.twin !== 0 || selectedStepSync.fromCollision.activeFold !== selectedStepSync.fromCollision.expectedFold ||
                selectedStepSync.fromTwin.collision !== 2 || selectedStepSync.fromTwin.activeFold !== selectedStepSync.fromTwin.expectedFold) {
              throw new Error('Selecting a fold did not synchronize its exact active bend across collision review, machine twin and core geometry: ' + JSON.stringify(selectedStepSync));
            }
            const playback = await page.evaluate(async () => {
              const btn = document.querySelector('#pp56Play'), stop = document.querySelector('#pp56Stop'), slider = document.querySelector('#pp56Travel');
              if (!btn || !stop || !slider || typeof btn.onclick !== 'function') return { error: 'Collision playback controls or click handler missing' };
              stop.click();
              btn.click();
              await new Promise(r => setTimeout(r, 550));
              const moved = Number(slider.value);
              btn.click();
              const held = Number(slider.value);
              await new Promise(r => setTimeout(r, 350));
